name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The Playwright project lives in Automation/; workflows must stay at the repo
# root, so every step runs from there.
defaults:
  run:
    working-directory: Automation

jobs:
  regression:
    name: Regression suite (known issues excluded)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Automation/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run typecheck

      # The gate: everything except the tests that reproduce open defects.
      - run: npm run test:stable

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: Automation/playwright-report/
          retention-days: 14

  known-issues:
    name: Known issues (expected to fail)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reported for visibility; a failure here is the open defect, not a broken build.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Automation/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:known-issues -- --project=chromium
